title: Splay
description: A scrolling tiling window manager for macOS. Each Space is one row of columns you walk with Cmd-Left and Cmd-Right. System Integrity Protection stays on.
# A project site. Every link and asset goes through relative_url or absolute_url,
# so emptying baseurl serves the same site from the root of a domain.
url: https://shawntz.github.io
baseurl: /splay
repository_url: https://github.com/shawntz/splay
# The latest release. scripts/release.sh sets it.
version: "0.0"
# No theme: the layouts and stylesheet are this folder's own.
theme: null
markdown: kramdown
permalink: pretty
relative_links:
  enabled: true
  collections: true
plugins:
  - jekyll-relative-links
exclude:
  - README.md
  - border-development.md
defaults:
  - scope:
      path: ""
    values:
      layout: default
